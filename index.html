<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- iPhone: als App vom Home-Bildschirm im Vollbild starten -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Abfahrt">
<title>Abfahrten Plänterwald</title>
<style>
  /* Bewusst nur Schwarz/Weiß/Grau – so lässt es sich später 1:1 aufs E-Ink-Display bringen. */
  :root { --bvg-yellow: #F0D722; --ink: #000; --paper: #fff; --muted: #666; --line: #000; --rule: #ccc; }
  /* Darkmode: folgt dem System, außer man hat per Knopf etwas anderes gewählt */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ink: #f2f2f2; --paper: #111; --muted: #999; --line: #f2f2f2; --rule: #333; }
  }
  :root[data-theme="dark"] { --ink: #f2f2f2; --paper: #111; --muted: #999; --line: #f2f2f2; --rule: #333; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    display: flex; justify-content: center;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  .board { width: 100%; max-width: 800px; }
  /* Kopfzeile: links Laufschrift (nimmt den Rest, ca. die Hälfte), dann Klappuhr, rechts Datum */
  header {
    display: grid; grid-template-columns: minmax(0, 1fr) auto auto;
    align-items: center; gap: 14px;
    border-bottom: 4px solid var(--line); padding-bottom: 6px; margin-bottom: 12px;
  }
  /* LED-Matrix wie die alten S-Bahn-Zugzielanzeiger – bewusst in beiden Modi dunkel */
  #led {
    width: 100%; height: 52px; display: block;
    background: #0d0a06; border-radius: 6px; border: 3px solid #2b2b2b;
  }

  /* Klappuhr (Flip-Clock) – Karten bleiben in beiden Modi dunkel, wie das echte Gerät */
  .flipclock { display: flex; align-items: center; justify-content: center; gap: 4px; }
  /* Sekunden etwas kleiner, unten bündig – wie bei echten Klappuhren */
  .flipclock .sec { align-self: flex-end; }
  .flip.small { --h: 38px; width: 24px; font-size: 28px; }
  .date { margin-left: 6px; text-align: right; line-height: 1.15; white-space: nowrap; }
  .date .wd { font-size: 22px; font-weight: 800; }
  .date .dm { font-size: 17px; color: var(--muted); }
  .flip-group { display: flex; gap: 3px; }
  .flip-colon { font-size: 30px; font-weight: 800; color: var(--ink); margin: 0 1px; line-height: 1; }
  .flip {
    --h: 52px; position: relative; width: 32px; height: var(--h);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 700; font-size: 40px;
    perspective: 220px; color: #f4f1ea; border-radius: 5px;
    box-shadow: 0 2px 3px rgba(0,0,0,.35);
  }
  .flip > div {
    position: absolute; left: 0; right: 0; height: 50%; overflow: hidden;
    backface-visibility: hidden;
  }
  .flip span { display: block; height: var(--h); line-height: var(--h); text-align: center; }
  .flip .top, .flip .flap-top { top: 0; border-radius: 5px 5px 0 0; background: #2c2c2c; transform-origin: bottom; }
  .flip .bottom, .flip .flap-bottom { bottom: 0; border-radius: 0 0 5px 5px; background: #242424; transform-origin: top; }
  .flip .bottom span, .flip .flap-bottom span { margin-top: calc(var(--h) / -2); }
  /* Trennfuge in der Mitte */
  .flip::after {
    content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px;
    background: #0b0b0b; z-index: 4;
  }
  .flip .flap-top, .flip .flap-bottom { display: none; z-index: 3; }
  .flip.flipping .flap-top { display: block; animation: flap-top .09s ease-in forwards; }
  .flip.flipping .flap-bottom { display: block; transform: rotateX(90deg); animation: flap-bottom .09s ease-out .09s forwards; }
  @keyframes flap-top { to { transform: rotateX(-90deg); } }
  @keyframes flap-bottom { to { transform: rotateX(0deg); } }

  /* Pixel-Bahnsteig: klein gezeichnet, pixelig hochskaliert */
  #platform {
    display: block; width: 100%; height: 198px; margin: 6px 0 14px; /* 192px Szene + 2 × 3px Rahmen */
    border: 3px solid #C9C9C9; border-radius: 8px;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }
  .bottom-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .bottom-bar footer { flex: 1; align-items: center; }

  /* API-Status als S-Bahn-Türknopf: LED-Kranz blinkt grün (ok) oder rot (keine Antwort) */
  .door-btn { --led: #6a6a6a; flex: none; width: 34px; height: 34px; display: block; }
  .door-btn.ok { --led: #33E05C; }
  .door-btn.err { --led: #FF2A1F; }
  .door-btn .leds line {
    stroke: var(--led); filter: drop-shadow(0 0 2px var(--led));
    animation: door-blink 1.2s steps(1) infinite;
  }
  .door-btn.loading .leds line { animation: none; filter: none; }
  @keyframes door-blink { 50% { stroke: #2e2e2e; filter: none; } }
  @media (prefers-reduced-motion: reduce) { .door-btn .leds line { animation: none; } }
  @media (max-width: 640px) {
    header { grid-template-columns: auto 1fr; }
  }
  @media (max-width: 480px) {
    .flip { --h: 44px; width: 27px; font-size: 34px; }
    .flip.small { --h: 32px; width: 20px; font-size: 23px; }
    .date .wd { font-size: 18px; }
    .date .dm { font-size: 14px; }
  }
  @media (max-width: 640px) {
    #led { grid-column: 1 / -1; }
    .flipclock { justify-content: flex-start; }
  }
  /* Hell/Dunkel als Kippschalter: Hebel kippt zur Sonne oder zum Mond */
  #theme-toggle { background: none; border: 0; padding: 0; cursor: pointer; display: block; }
  #theme-toggle svg { display: block; width: 82px; height: 46px; }
  #theme-toggle .lever { transition: transform .22s cubic-bezier(.5, 1.6, .5, 1); transform-origin: 36px 28px; transform: rotate(-38deg); }
  #theme-toggle[data-mode="dark"] .lever { transform: rotate(38deg); }
  #theme-toggle .sun, #theme-toggle .moon { transition: opacity .2s; opacity: .3; }
  #theme-toggle[data-mode="light"] .sun, #theme-toggle[data-mode="dark"] .moon { opacity: 1; }
  #theme-toggle:focus-visible { outline: 2px solid var(--muted); outline-offset: 2px; border-radius: 6px; }

  section { margin-bottom: 18px; }
  .sec-head {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 14px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700;
    border-bottom: 2px solid var(--line); padding-bottom: 3px; margin-bottom: 2px;
  }
  .sec-head .title { display: flex; align-items: center; gap: 8px; }
  .sec-head .icon { width: 22px; height: 22px; flex: none; display: block; }
  .sec-head { gap: 10px; }
  .sec-head .title { flex: 1; min-width: 0; padding-left: 4px; }
  .sec-head .walk { white-space: nowrap; }
  .sec-head .walk { font-weight: 400; text-transform: none; letter-spacing: 0; }

  .row {
    display: grid; grid-template-columns: 64px 1fr auto 96px;
    align-items: center; gap: 12px; padding: 7px 4px;
    border-bottom: 1px solid var(--rule);
  }
  .badge {
    font-weight: 800; font-size: 18px; text-align: center; padding: 3px 0;
    border: 2px solid var(--ink); border-radius: 4px;
  }
  .badge.s {
    border-radius: 14px; color: #fff;
    background: var(--line-color, var(--ink)); border-color: var(--line-color, var(--ink));
  }
  .dest { font-size: 19px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dest-name { display: inline-block; white-space: nowrap; }
  .dest small { display: block; font-size: 13px; font-weight: 400; color: var(--muted); }
  .leave { font-size: 14px; text-align: right; white-space: nowrap; }
  .leave b { font-size: 17px; }
  .mins { font-size: 30px; font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; }
  .mins span { font-size: 15px; font-weight: 600; }
  .num { display: inline-block; font-weight: inherit; }

  /* Busnummern im BVG-Gelb */
  .badge.bus { background: var(--bvg-yellow); color: #000; border-color: var(--bvg-yellow); }
  /* Tramlinien in BVG-Rot */
  .badge.tram { background: #BE1E2D; color: #fff; border-color: #BE1E2D; }
  /* "JETZT LOS!" – rot hinterlegt und blinkend */
  .go-label {
    display: inline-block; background: #E30613; color: #fff; font-weight: 800; font-size: 16px;
    padding: 4px 9px; border-radius: 4px; animation: go-blink 1.6s steps(1) infinite;
  }
  @keyframes go-blink { 50% { background: transparent; color: #E30613; } }
  @media (prefers-reduced-motion: reduce) { .go-label { animation: none; } }
  /* Abgelaufene Zeile: Mini-S-Bahn bzw. Mini-Bus fährt von links nach rechts durch und räumt sie ab */
  .row { position: relative; overflow: hidden; }
  .wiper {
    position: absolute; left: 0; top: 0; bottom: 0; width: var(--veh-w); z-index: 2;
    display: flex; align-items: flex-end;
    transform: translateX(-100%); animation: drive var(--dur) cubic-bezier(.3, .15, .75, .6) forwards; /* rollt mit etwas Tempo an, beschleunigt dann */
  }
  .wiper::before { /* Abdeckung: alles hinter der Fahrzeugnase ist leer, die Nase selbst bleibt frei sichtbar */
    content: ''; position: absolute; left: -3000px; right: var(--nose); top: 0; bottom: 0; background: var(--paper);
  }
  .wiper canvas { display: block; width: 100%; height: var(--veh-h); position: relative; z-index: 1; image-rendering: pixelated; }
  @keyframes drive { to { transform: translateX(var(--row-w)); } }
  .row.cancelled .dest, .row.cancelled .mins .num, .row.cancelled .mins span { text-decoration: line-through; }
  .row.cancelled .dest, .row.cancelled .mins { color: var(--muted); }

  .empty { padding: 10px 4px; color: var(--muted); font-style: italic; }
  footer { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
  footer.error { color: var(--ink); font-weight: 700; }

  /* Handy: "los in …" rechts unter die Minuten, damit die Zeilen flach bleiben */
  @media (max-width: 520px) {
    .row { grid-template-columns: 52px 1fr auto; column-gap: 10px; row-gap: 0; }
    .badge { grid-row: 1 / 3; }
    .dest { grid-row: 1 / 3; font-size: 17px; }
    .mins { grid-row: 1; grid-column: 3; font-size: 26px; line-height: 1.05; }
    .leave { grid-row: 2; grid-column: 3; font-size: 12px; }
    .leave b { font-size: 14px; }
    .go-label { font-size: 12px; padding: 2px 6px; }
  }
</style>
</head>
<body>
<div class="board">
  <header>
    <canvas id="led" aria-label="Laufschrift"></canvas>
    <div class="flipclock" id="flipclock" aria-live="off">
      <div class="flip-group"><div class="flip" data-key="h1"></div><div class="flip" data-key="h2"></div></div>
      <div class="flip-colon">:</div>
      <div class="flip-group"><div class="flip" data-key="m1"></div><div class="flip" data-key="m2"></div></div>
      <div class="flip-group sec"><div class="flip small" data-key="s1"></div><div class="flip small" data-key="s2"></div></div>
    </div>
    <div class="date"><div class="wd" id="date-wd"></div><div class="dm" id="date-dm"></div></div>
  </header>
  <div id="sections"></div>
  <canvas id="platform" aria-label="Bahnsteig Plänterwald mit wartenden Leuten"></canvas>
  <div class="bottom-bar">
    <svg class="door-btn loading" id="api-light" viewBox="0 0 100 100" role="img" aria-label="API-Status">
      <circle cx="50" cy="50" r="49" fill="#3DA57F"/>
      <circle cx="50" cy="50" r="40" fill="#1b1d1c"/>
      <g class="leds" stroke-width="3.4" stroke-linecap="round"></g>
      <circle cx="50" cy="50" r="23" fill="#3DA57F"/>
      <path d="M45 40 L36 50 L45 60 M55 40 L64 50 L55 60" fill="none" stroke="#1b1d1c" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <footer id="status">Lade…</footer>
    <button id="theme-toggle" type="button" title="Hell / Dunkel umschalten" aria-label="Hell / Dunkel umschalten">
      <svg viewBox="0 0 72 40" aria-hidden="true">
        <defs>
          <radialGradient id="tg-nut" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#f4f4f4"/><stop offset=".6" stop-color="#a9a9a9"/><stop offset="1" stop-color="#6d6d6d"/></radialGradient>
          <linearGradient id="tg-lever" x1="0" x2="1"><stop offset="0" stop-color="#8d8d8d"/><stop offset=".45" stop-color="#f7f7f7"/><stop offset="1" stop-color="#8a8a8a"/></linearGradient>
        </defs>
        <g class="sun" fill="#F5B700" stroke="#F5B700" stroke-width="1.6" stroke-linecap="round">
          <circle cx="9" cy="28" r="3.6" stroke="none"/>
          <path d="M9 21.5v2 M9 32.5v2 M2.5 28h2 M13.5 28h2 M4.4 23.4l1.4 1.4 M12.2 31.2l1.4 1.4 M4.4 32.6l1.4-1.4 M12.2 24.8l1.4-1.4"/>
        </g>
        <path class="moon" d="M66 23.5a5 5 0 1 0 2.8 8.6a4 4 0 1 1 -2.8 -8.6z" fill="#8FA2EE"/>
        <g transform="translate(36 28) scale(.78) translate(-36 -28)">
        <polygon points="36,19 43.8,23.5 43.8,32.5 36,37 28.2,32.5 28.2,23.5" fill="url(#tg-nut)" stroke="#555" stroke-width=".6"/>
        <circle cx="36" cy="28" r="5" fill="#bdbdbd" stroke="#666" stroke-width=".6"/>
        <g class="lever">
          <path d="M33.6 28 L34.4 7 h3.2 L38.4 28 z" fill="url(#tg-lever)" stroke="#666" stroke-width=".5"/>
          <rect x="33.4" y="3" width="5.2" height="7" rx="2.6" fill="url(#tg-lever)" stroke="#666" stroke-width=".5"/>
        </g>
        </g>
      </svg>
    </button>
  </div>
</div>

<script>
// ---------- Konfiguration ----------
const API = 'https://v6.vbb.transport.rest';
const REFRESH_MS = 5000;
const ROWS_PER_STOP = 5;
const LIVE_MAX_AGE = 3 * 60000; // so lange bleiben die letzten Live-Daten gültig, wenn die API ausfällt

// product: Verkehrsmittel der Haltestelle. lines: '*' = alle Linien, sonst Linie -> Ziele (leer = alle Ziele).
// via: nur Fahrten, die danach über diese Haltestelle fahren. walk 0 = keine Wegzeit.
const STOPS = [
  { id: '900191002', label: 'S Plänterwald', icon: 'sbahn', walk: 15, product: 'suburban', lines: '*' },
  { id: '900191005', label: 'Köpenicker Landstr./Eichbuschallee', icon: 'bus', walk: 15, product: 'bus', lines: { '165': [], '166': [] } },
  { id: '900191504', label: 'Eichbuschallee', icon: 'bus', walk: 20, product: 'bus', lines: { '265': [] } },
  { id: '900191510', label: 'Bergaustr.', icon: 'bus', walk: 10, product: 'bus', lines: { '166': [] } },
];
const KIND = { suburban: 's', bus: 'bus', tram: 'tram' };

// Offizielle Linienfarben der S-Bahn Berlin
const LINE_COLORS = {
  S1: '#DE4DA4', S2: '#005F27', S25: '#005F27', S26: '#005F27', S3: '#0A4C99',
  S41: '#AD5937', S42: '#CB6418', S45: '#CD9C53', S46: '#CD9C53', S47: '#CD9C53',
  S5: '#EB7405', S7: '#816DA6', S75: '#816DA6', S8: '#55A822', S85: '#55A822', S9: '#992746',
};

// Symbole für die Abschnittsüberschriften
const ICONS = {
  // S-Bahn: grüner Kreis mit weißem S
  sbahn: `<svg class="icon" viewBox="0 0 24 24" aria-label="S-Bahn"><circle cx="12" cy="12" r="12" fill="#008D4F"/>
    <text x="12" y="17.6" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-weight="700" font-size="17" fill="#fff">S</text></svg>`,
  // Bus: das typische lila BUS-Schild
  bus: `<svg class="icon" viewBox="0 0 34 22" style="width:34px" aria-label="Bus"><rect width="34" height="22" rx="4" fill="#95276E"/>
    <text x="17" y="16" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-weight="700" font-size="13" letter-spacing=".3" fill="#fff">BUS</text></svg>`,
  // Tram: rotes TRAM-Schild
  tram: `<svg class="icon" viewBox="0 0 42 22" style="width:42px" aria-label="Tram"><rect width="42" height="22" rx="4" fill="#BE1E2D"/>
    <text x="21" y="16" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-weight="700" font-size="13" letter-spacing=".3" fill="#fff">TRAM</text></svg>`,
};

// ---------- Logik ----------
const fmtTime = d => d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
const cleanName = s => s.replace(/^Berlin,\s*/, '').replace(/\s*\((Berlin)\)/, '').replace(/\s*\[[^\]]*\]/, '').replace(/\s+Bhf\b/, '');

async function loadStop(stop) {
  const params = new URLSearchParams({
    duration: 60, results: 100, remarks: 'false',
    suburban: 'false', bus: 'false', tram: 'false', subway: 'false', ferry: 'false', express: 'false', regional: 'false',
    [stop.product]: 'true',
  });
  if (stop.via) params.set('direction', stop.via);
  // Nach 8 s abbrechen, damit eine hängende API das Dashboard nicht blockiert
  const res = await fetch(`${API}/stops/${stop.id}/departures?${params}`, { signal: AbortSignal.timeout(8000) });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  lastGood[stop.id] = { departures: data.departures || [], at: new Date() };
}

// Letzte erfolgreiche Antwort je Station – wird weiter angezeigt, wenn die API mal ausfällt
const lastGood = {};

function reachable(stop, departures) {
  const now = Date.now();
  return departures
    .filter(d => {
      if (stop.lines === '*') return true;
      const targets = stop.lines[d.line?.name];
      return targets && (!targets.length || targets.some(t => (d.direction || '').includes(t)));
    })
    .map(d => {
      const when = new Date(d.when || d.plannedWhen);
      const minsAway = (when - now) / 60000;
      return {
        line: d.line.name,
        dest: cleanName(d.direction),
        when,
        delay: d.delay != null ? Math.round(d.delay / 60) : null,
        cancelled: !!d.cancelled,
        minsAway,
        leaveIn: minsAway - stop.walk,
        walk: stop.walk,
        kind: KIND[stop.product],
        // Schlüssel unabhängig von der Quelle (live oder Offline-Fahrplan): Haltestelle, Linie, geplante Minute
        key: `${stop.id}|${d.line.name}|${Math.round(new Date(d.plannedWhen || d.when) / 60000)}`,
        expiresAt: when.getTime() - stop.walk * 60000, // ab hier nicht mehr erreichbar
      };
    })
    // nur was ich noch erreiche
    .filter(d => d.leaveIn >= 0)
    .sort((a, b) => a.when - b.when)
    .slice(0, ROWS_PER_STOP);
}

function rowHtml(d) {
  const leave = Math.max(0, Math.floor(d.leaveIn));
  const go = d.walk > 0 && !d.cancelled && d.leaveIn < 1.5;
  let delayTxt = '';
  if (d.cancelled) delayTxt = 'fällt aus';
  else if (d.delay > 0) delayTxt = `+${d.delay} min`;
  else if (d.delay === 0) delayTxt = 'pünktlich';
  // Animationsphase an die Uhr koppeln, damit das Neu-Rendern alle 5 s das Blinken nicht stört
  const leaveTxt = d.cancelled || !d.walk ? '' : go
    ? `<span class="go-label" style="animation-delay:-${Date.now() % 1600}ms">JETZT LOS!</span>`
    : `los in <b class="num" data-f="l">${leave}</b> min`;
  return `
    <div class="row ${d.cancelled ? 'cancelled' : ''}" data-key="${d.key}" data-expires="${d.expiresAt}" data-kind="${d.kind}">
      <div class="badge ${d.kind}"${LINE_COLORS[d.line] ? ` style="--line-color:${LINE_COLORS[d.line]}"` : ''}>${d.line}</div>
      <div class="dest"><span class="dest-name">${d.dest}</span><small>${fmtTime(d.when)}${delayTxt ? ' · ' + delayTxt : ''}</small></div>
      <div class="leave">${leaveTxt}</div>
      <div class="mins"><b class="num" data-f="m">${Math.max(0, Math.floor(d.minsAway))}</b><span> min</span></div>
    </div>`;
}

// ---------- Offline-Fahrplan ----------
// Sollfahrplan aus den offiziellen VBB-Fahrplandaten (GTFS), nur unsere Haltestellen und Linien stadteinwärts.

const offlineCache = {};
function offlineDay(date) {
  const key = date.toDateString();
  if (offlineCache[key]) return offlineCache[key];
  const start = new Date(OFFLINE.start + 'T00:00:00');
  const idx = Math.round((new Date(date.getFullYear(), date.getMonth(), date.getDate()) - start) / 86400000);
  const pat = idx >= 0 && idx < OFFLINE.days.length ? OFFLINE.days[idx] : OFFLINE.weekday[(date.getDay() + 6) % 7];
  return (offlineCache[key] = OFFLINE.patterns[pat].split(';').map(e => e.split(',').map(Number)));
}
// liefert Abfahrten im selben Format wie die Live-API
function offlineDepartures(stop) {
  const now = new Date(), out = [];
  for (const back of [1, 0]) {                       // gestern (Fahrten nach Mitternacht) und heute
    const day = new Date(now.getFullYear(), now.getMonth(), now.getDate() - back);
    for (const [min, st, li, he] of offlineDay(day)) {
      if (OFFLINE.stops[st] !== stop.id) continue;
      const when = new Date(day.getTime() + min * 60000);
      if (when < now - 60000 || when - now > 90 * 60000) continue;
      out.push({ line: { name: OFFLINE.lines[li] }, direction: OFFLINE.heads[he], tripId: 'plan',
        plannedWhen: when.toISOString(), when: when.toISOString(), delay: null, cancelled: false });
    }
  }
  return out;
}

// ---------- Mini-Fahrzeuge (Pixel-Look wie auf dem Bahnsteig) ----------
// S-Bahn Baureihe 481: gelb/rot, Fenster mit Lichtkante, Schiebetüren, grünes S, Drehgestelle,
// Führerstand an beiden Enden. 20 Pixel hoch gezeichnet, wird pixelig hochskaliert.
function drawPixelSBahn(c, x0, top, cars, L, o = {}) {
  const doors = o.doors || 0, inside = o.inside || '#4A3F38';
  const R = (x, y, w, h, col) => { c.fillStyle = col; c.fillRect(Math.round(x), top + y, Math.round(w), h); };
  for (let i = 0; i < cars; i++) {
    const x = x0 + i * (L + 2), first = i === 0, last = i === cars - 1;
    for (let y = 0; y <= 15; y++) {     // Wagenkasten zeilenweise – an den Zugenden mit runder Nase
      const nose = y === 0 ? 3 : y === 1 ? 1 : 0, edge = y === 0 ? 1 : 0;
      const l = first ? nose : edge, rr = last ? nose : edge;
      R(x + l, y, L - l - rr, 1, y === 0 ? '#D4A800' : y <= 8 ? '#F2C200' : '#C8102E');
    }
    R(x, 16, L, 1, '#2E2E2E');           // Unterkante
    for (const fx of [.1, .4, .53, .82]) {
      if ((first && fx < .2) || (last && fx > .8)) continue;
      const wx = x + L * fx; R(wx, 3, 6, 4, '#2B3550'); R(wx, 3, 6, 1, '#7F97C2'); R(wx + 5, 4, 1, 3, '#1E2640');
    }
    for (const fx of [.26, .66]) {       // Schiebetür: zwei Flügel mit Fensterchen
      const dx = x + L * fx, op = Math.round(doors * 3);
      if (op > 0) R(dx, 2, 6, 14, inside);
      R(dx - op, 2, 3, 14, '#A3A9AF'); R(dx + 3 + op, 2, 3, 14, '#A3A9AF');
      R(dx - op + 1, 3, 1, 5, '#2B3550'); R(dx + 4 + op, 3, 1, 5, '#2B3550');
    }
    R(x + L * .5 - 1, 11, 3, 3, '#008D4F'); R(x + L * .5, 12, 1, 1, '#FFFFFF');   // grünes S
    for (const bx of [x + 3, x + L - 13]) {   // Drehgestelle mit zwei Rädern
      R(bx, 17, 10, 1, '#2A2A2A'); R(bx + 1, 18, 3, 2, '#1A1A1A'); R(bx + 6, 18, 3, 2, '#1A1A1A');
      R(bx + 2, 18, 1, 1, '#8A8A8A'); R(bx + 7, 18, 1, 1, '#8A8A8A');
    }
    if (!last) R(x + L, 12, 2, 2, '#2A2A2A');                                      // Kupplung
    if (first) { R(x + 1, 2, 4, 6, '#2B3550'); R(x + 1, 2, 4, 1, '#7F97C2'); R(x, 12, 1, 2, '#FF3B30'); }
    if (last) { R(x + L - 5, 2, 4, 6, '#2B3550'); R(x + L - 5, 2, 4, 1, '#7F97C2'); R(x + L - 1, 12, 1, 2, '#FFF6C2'); }
  }
}

  for (const dx of [14, 48, 84]) { R(dx, 6, 4, 10, '#2B2F38'); R(dx, 6, 4, 1, '#5D6B80'); R(dx + 2, 7, 1, 9, '#F0D722'); }
  R(0, 16, TRAM_PX_W, 2, '#5A5A5A'); R(0, 17, TRAM_PX_W, 1, '#3E3E3E');           // Schürze
  for (const bx of [6, 46, 88]) { R(bx, 18, 10, 1, '#2A2A2A'); R(bx + 1, 19, 3, 1, '#1A1A1A'); R(bx + 6, 19, 3, 1, '#1A1A1A'); }
  R(TRAM_PX_W - 5, 5, 4, 8, '#2B2F38'); R(TRAM_PX_W - 5, 5, 4, 1, '#7F97C2');      // Frontscheibe
  R(TRAM_PX_W - 14, 4, 9, 1, '#FF9F1C');                                           // Zielanzeige
  R(TRAM_PX_W - 1, 13, 1, 1, '#FFF6C2'); R(0, 13, 1, 1, '#FF3B30');               // Licht vorne / hinten
}

// Lässt das passende Fahrzeug durch die Zeile fahren und klappt sie danach zu
function driveAway(row) {
  return new Promise(resolve => {
    const rowW = row.clientWidth, kind = row.dataset.kind, isS = kind === 's';
    const vehH = row.clientHeight - 4; // so hoch wie die Zeile, damit die Nase die Schrift ganz überdeckt
    const scale = vehH / 20;                              // Pixelgröße der Fahrzeuggrafik
    const vehW = isS ? rowW : Math.round((kind === 'tram' ? TRAM_PX_W : BUS_PX_W) * scale);
    const wiper = document.createElement('div');
    wiper.className = 'wiper';
    wiper.style.setProperty('--veh-w', `${vehW}px`);
    wiper.style.setProperty('--veh-h', `${vehH}px`);
    wiper.style.setProperty('--nose', `${Math.round(scale * (isS ? 5 : kind === 'tram' ? 5 : 3))}px`); // Länge der Front
    wiper.style.setProperty('--row-w', `${rowW + vehW}px`);
    wiper.style.setProperty('--dur', isS ? '8s' : kind === 'tram' ? '7s' : '6s');
    const cv = document.createElement('canvas'), cx = cv.getContext('2d');
    if (isS) {
      const wInt = Math.round(vehW / scale), cars = Math.max(2, Math.round(wInt / 48));
      const L = Math.floor((wInt - 2 * (cars - 1)) / cars);
      cv.width = cars * L + 2 * (cars - 1); cv.height = 20;
      drawPixelSBahn(cx, 0, 0, cars, L);
    } else if (kind === 'tram') { cv.width = TRAM_PX_W; cv.height = 20; drawPixelTram(cx, 0, 0); }
    else { cv.width = BUS_PX_W; cv.height = 20; drawPixelBus(cx, 0, 0); }
    wiper.appendChild(cv);
    row.appendChild(wiper);
    wiper.addEventListener('animationend', resolve, { once: true });
  });
}

// Zu lange Ziele laufen durch: 3 s stehen, bis zum Ende laufen, 1,5 s halten, wieder zurücklaufen.
// Der Takt hängt an der Zeile (seit wann sie zu sehen ist), damit das Neuzeichnen jede Sekunde ihn nicht stört.
const MARQUEE_WAIT = 3000, MARQUEE_HOLD = 1500, MARQUEE_SPEED = 30;   // Pixel pro Sekunde
const marqueeSince = new Map();
function applyMarquees() {
  const now = performance.now(), present = new Set();
  document.querySelectorAll('#sections .row[data-key]').forEach(row => {
    const key = row.dataset.key, name = row.querySelector('.dest-name'), box = row.querySelector('.dest');
    present.add(key);
    if (!marqueeSince.has(key)) marqueeSince.set(key, now);
    const shift = Math.ceil(name.scrollWidth - box.clientWidth);
    if (shift <= 2 || reduceMotion) return;
    const run = shift / MARQUEE_SPEED * 1000, total = MARQUEE_WAIT + run + MARQUEE_HOLD + run;
    const anim = name.animate([
      { transform: 'translateX(0)', offset: 0 },
      { transform: 'translateX(0)', offset: MARQUEE_WAIT / total },
      { transform: `translateX(${-shift}px)`, offset: (MARQUEE_WAIT + run) / total },
      { transform: `translateX(${-shift}px)`, offset: (MARQUEE_WAIT + run + MARQUEE_HOLD) / total },
      { transform: 'translateX(0)', offset: 1 },
    ], { duration: total, iterations: Infinity });
    anim.currentTime = (now - marqueeSince.get(key)) % total;
  });
  for (const k of marqueeSince.keys()) if (!present.has(k)) marqueeSince.delete(k);
}

function flipNumber(el, oldTxt, newTxt) {
  el.textContent = oldTxt;
  const out = el.animate([{ transform: 'perspective(200px) rotateY(0)' }, { transform: 'perspective(200px) rotateY(90deg)' }],
    { duration: 130, easing: 'ease-in' });
  out.onfinish = () => {
    el.textContent = newTxt;
    el.animate([{ transform: 'perspective(200px) rotateY(-90deg)' }, { transform: 'perspective(200px) rotateY(8deg)', offset: .7 },
      { transform: 'perspective(200px) rotateY(0)' }], { duration: 260, easing: 'ease-out' });
  };
}

// Abfragen (alle REFRESH_MS) und Anzeigen (jede Sekunde, aus den zuletzt geladenen Daten) sind getrennt,
// damit Zeilen sekundengenau verschwinden und die Minuten flüssig herunterzählen.
let fetching = false, lastResults = null;
async function refresh() {
  if (fetching) return; // keine überlappenden Anfragen
  fetching = true;
  lastResults = await Promise.allSettled(STOPS.map(loadStop));
  fetching = false;
  render();
}

let rendering = false;
async function render() {
  if (rendering) return; // läuft gerade eine Wegfahr-Animation, warten wir
  rendering = true;
  const status = document.getElementById('status');
  const html = STOPS.map((stop, i) => {
    // Live-Daten, solange sie frisch sind – sonst der Offline-Fahrplan
    const live = lastGood[stop.id];
    const liveOk = live && (lastResults?.[i]?.status !== 'rejected' || Date.now() - live.at < LIVE_MAX_AGE);
    const cached = liveOk ? live : lastResults ? { departures: offlineDepartures(stop) } : null;
    const deps = cached ? reachable(stop, cached.departures) : null;
    const err = lastResults?.[i]?.reason;
    let body;
    if (!cached) body = `<div class="empty">${err ? `Keine Daten (${err.name === 'TimeoutError' ? 'API antwortet nicht' : err.message})` : 'Lade…'}</div>`;
    else if (!deps.length) body = `<div class="empty">Keine erreichbare Abfahrt in den nächsten 60 min</div>`;
    else body = deps.map(rowHtml).join('');
    return `<section>
      <div class="sec-head"><span class="title">${ICONS[stop.icon] || ''}${stop.label}</span><span class="walk">${stop.walk ? stop.walk + ' min Fußweg' : 'alle Richtungen'}</span></div>
      ${body}
    </section>`;
  }).join('');
  // Zeilen, die gerade unerreichbar geworden sind, erst wegfahren lassen
  const keep = new Set([...html.matchAll(/data-key="([^"]+)"/g)].map(m => m[1]));
  const gone = [...document.querySelectorAll('#sections .row[data-key]')]
    // auch wenn sich die Echtzeit-Prognose kurz vorher noch nach vorn verschiebt, fährt das Fahrzeug durch
    .filter(el => !keep.has(el.dataset.key) && Number(el.dataset.expires) <= Date.now() + 2 * 60000);
  if (gone.length && !reduceMotion) await Promise.all(gone.map(driveAway));
  // Nachrücken: alte Positionen merken, neu zeichnen, dann sanft von alt nach neu gleiten
  const before = new Map([...document.querySelectorAll('#sections .row[data-key]')].map(el => [el.dataset.key, el.getBoundingClientRect().top]));
  const oldNums = new Map([...document.querySelectorAll('#sections .row[data-key] .num')].map(n => [n.closest('.row').dataset.key + n.dataset.f, n.textContent]));
  document.getElementById('sections').innerHTML = html;
  applyMarquees();
  if (before.size && !reduceMotion) {
    // geänderte Zahlen drehen sich kurz zur Seite und die neue dreht sich rein
    document.querySelectorAll('#sections .row[data-key] .num').forEach(n => {
      const old = oldNums.get(n.closest('.row').dataset.key + n.dataset.f);
      if (old !== undefined && old !== n.textContent) flipNumber(n, old, n.textContent);
    });
    document.querySelectorAll('#sections .row[data-key]').forEach(el => {
      const old = before.get(el.dataset.key);
      if (old === undefined) {
        // neue Zeile klappt von vorne nach oben – Scharnier unten, Oberkante kommt vom Betrachter her hoch
        el.style.transformOrigin = 'center bottom';
        el.animate([{ transform: 'perspective(500px) rotateX(-90deg)', opacity: 0 }, { transform: 'perspective(500px) rotateX(0)', opacity: 1 }],
          { duration: 600, delay: 250, easing: 'cubic-bezier(.3, 1.3, .5, 1)', fill: 'backwards' });
      } else if (Math.abs(old - el.getBoundingClientRect().top) > 1) {
        el.animate([{ transform: `translateY(${old - el.getBoundingClientRect().top}px)` }, { transform: 'none' }],
          { duration: 550, easing: 'cubic-bezier(.3, .8, .3, 1)' });
      }
    });
  }
  rendering = false;

  if (!lastResults) return; // erste Abfrage läuft noch
  const failed = lastResults.filter(r => r.status === 'rejected').length;
  status.className = failed ? 'error' : '';
  const light = document.getElementById('api-light');
  light.setAttribute('class', `door-btn ${failed ? 'err' : 'ok'}`);
  light.setAttribute('aria-label', failed ? 'Keine Verbindung zu VBB' : 'Verbindung zu VBB ok');
  const offlineInUse = STOPS.some((st, i) => !(lastGood[st.id] && (lastResults[i].status !== 'rejected' || Date.now() - lastGood[st.id].at < LIVE_MAX_AGE)));
  status.innerHTML = `<span>${!failed ? 'Live-Daten VBB' : offlineInUse ? 'Keine Verbindung zu VBB – Offline-Fahrplan aktiv' : 'Keine Verbindung zu VBB – zeige letzte Live-Daten'}</span>`;
}

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const flips = {};
document.querySelectorAll('#flipclock .flip').forEach(el => {
  el.innerHTML = ['top', 'bottom', 'flap-top', 'flap-bottom'].map(c => `<div class="${c}"><span></span></div>`).join('');
  const part = c => el.querySelector(`.${c} span`);
  flips[el.dataset.key] = { el, top: part('top'), bottom: part('bottom'), flapTop: part('flap-top'), flapBottom: part('flap-bottom'), value: null };
  // Nach der Animation steht der neue Wert auch unten fest
  el.querySelector('.flap-bottom').addEventListener('animationend', () => {
    flips[el.dataset.key].bottom.textContent = flips[el.dataset.key].value;
    el.classList.remove('flipping');
  });
});

function setFlip(key, value) {
  const f = flips[key];
  if (f.value === value) return;
  const old = f.value;
  f.value = value;
  if (old === null || reduceMotion) {
    f.top.textContent = f.bottom.textContent = value;
    return;
  }
  // Oben schon neu, unten noch alt – die Klappe fällt dazwischen
  f.top.textContent = value;
  f.bottom.textContent = old;
  f.flapTop.textContent = old;
  f.flapBottom.textContent = value;
  f.el.classList.remove('flipping');
  void f.el.offsetWidth; // Animation neu starten
  f.el.classList.add('flipping');
}

function tickClock() {
  const now = new Date();

  setFlip('h1', hh[0]); setFlip('h2', hh[1]);

  const ss = String(now.getSeconds()).padStart(2, '0');
  setFlip('s1', ss[0]); setFlip('s2', ss[1]);
}

function sayingOfToday() {
  const q = new URLSearchParams(location.search).get('datum');   // zum Testen: ?datum=2026-11-03
  const now = q ? new Date(q + 'T12:00:00') : new Date();
  if (now.getMonth() + 1 === LED_BIRTHDAY.month && now.getDate() === LED_BIRTHDAY.day) return LED_BIRTHDAY.text;
  const day = Math.floor(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) / 86400000);

const LED_FONT = { // 5x7-Pixelschrift, eine Zeile pro Pixelreihe

// Text in Pixelspalten umwandeln (je Spalte 7 Bits)
function textToCols(text) {
  const cols = [];
  for (const ch of text) {
    const g = LED_FONT[ch] || LED_FONT[' '];
    for (let x = 0; x < g[0].length; x++) cols.push(g.map(row => row[x] === '1'));
    cols.push(Array(7).fill(false)); // Abstand zwischen Buchstaben
  }
  cols.pop();
  return cols;
}
let ledText = sayingOfToday();
let scrollCols = textToCols(ledText);
const stationCols = textToCols(LED_STATION);

const led = document.getElementById('led');
const ledCtx = led.getContext('2d');
let ledStart = null;
function drawLed(t) {
  if (ledStart === null) ledStart = t;
  const dpr = window.devicePixelRatio || 1;
  const w = led.clientWidth, h = led.clientHeight;
  if (led.width !== Math.round(w * dpr)) { led.width = Math.round(w * dpr); led.height = Math.round(h * dpr); }
  ledCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ledCtx.clearRect(0, 0, w, h);

  // Punktraster so fein wählen, dass der Stationsname komplett hineinpasst
  const pitch = Math.min(h / 9, w / (stationCols.length + 4));
  const rows = Math.floor(h / pitch), cols = Math.floor(w / pitch);
  const xOff = (w - cols * pitch) / 2, yOff = (h - rows * pitch) / 2;
  const top = Math.floor((rows - 7) / 2);
  const r = pitch * 0.36;

  // Wo im Ablauf sind wir gerade?
  const passCols = cols + scrollCols.length;             // Text kommt rechts rein und läuft links ganz raus
  const scrollSec = LED_PASSES * passCols / LED_SPEED;
  let cycle = (t - ledStart) / 1000;
  if (cycle >= scrollSec + LED_STATIC_SEC) {
    // Durchgang fertig: neu starten und dabei den Spruch des (evtl. neuen) Tages laden
    ledStart = t; cycle = 0;
    ledText = sayingOfToday();
    scrollCols = textToCols(ledText);
  }
  let colAt;
  if (cycle < scrollSec) {
    const shift = Math.floor(cycle * LED_SPEED) % passCols;
    colAt = c => scrollCols[c - cols + shift];
    led.setAttribute('aria-label', ledText);
  } else {
    const left = Math.floor((cols - stationCols.length) / 2);
    colAt = c => stationCols[c - left];
    led.setAttribute('aria-label', 'Plänterwald, Ausstieg links');
  }

  for (let c = 0; c < cols; c++) {
    const col = colAt(c);
    for (let rr = 0; rr < rows; rr++) {
      const on = col && rr >= top && rr < top + 7 && col[rr - top];
      ledCtx.beginPath();
      ledCtx.arc(xOff + c * pitch + pitch / 2, yOff + rr * pitch + pitch / 2, r, 0, Math.PI * 2);
      if (on) { ledCtx.fillStyle = '#FFB31A'; ledCtx.shadowColor = '#FF9900'; ledCtx.shadowBlur = pitch * 0.9; }
      else { ledCtx.fillStyle = '#2a2012'; ledCtx.shadowBlur = 0; }
      ledCtx.fill();
    }
  }
  ledCtx.shadowBlur = 0;
  requestAnimationFrame(drawLed);
}

const PF_MOOD_KEYS = [[-12, 'night'], [-7, 'blue'], [-3, 'glow'], [.5, 'sunset'], [3, 'sunset'], [8, 'golden'], [15, 'day']];
const PF_BANDS = 11, PF_BAND_H = 4;

// Sonnenstand für Berlin (vereinfachte NOAA-Formel) – berücksichtigt automatisch lange Sommer- und kurze Wintertage
const PF_LAT = 52.47, PF_LON = 13.49;
function pfSun(date) {
  const rad = Math.PI / 180, d = date.getTime() / 86400000 - 10957.5;  // Tage seit 1.1.2000 12:00 UTC
  const g = (357.529 + .98560028 * d) * rad, q = 280.459 + .98564736 * d;
  const L = (q + 1.915 * Math.sin(g) + .020 * Math.sin(2 * g)) * rad, e = (23.439 - .00000036 * d) * rad;
  const ra = Math.atan2(Math.cos(e) * Math.sin(L), Math.cos(L)), dec = Math.asin(Math.sin(e) * Math.sin(L));
  const gmst = ((18.697374558 + 24.06570982441908 * d) % 24 + 24) % 24;
  const H = (gmst * 15 + PF_LON) * rad - ra, lat = PF_LAT * rad;
  const elev = Math.asin(Math.sin(lat) * Math.sin(dec) + Math.cos(lat) * Math.cos(dec) * Math.cos(H)) / rad;
  const az = (Math.atan2(-Math.sin(H), Math.tan(dec) * Math.cos(lat) - Math.sin(lat) * Math.cos(H)) / rad + 360) % 360;
  return { elev, az };
}

const pfParams = new URLSearchParams(location.search);
function pfNow() {

  if (pfParams.get('datum')) { const [y, m, dd] = pfParams.get('datum').split('-').map(Number); now.setFullYear(y, m - 1, dd); }
  if (pfParams.get('zeit')) {

    const start = pfNow.start || (pfNow.start = Date.now());
    now.setHours(h, mi, 0, 0); now.setTime(now.getTime() + (Date.now() - start));
  }

}

const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function mix(a, b, t) {

const clamp01 = v => Math.max(0, Math.min(1, v));

let pfPal = null, pfPalAt = -1;
function pfPalette() {
  if (pfPal && pfTime - pfPalAt < 2) return pfPal;      // alle 2 s neu berechnen reicht
  pfPalAt = pfTime;
  const sun = pfSun(pfNow()), e = sun.elev;
  let i = PF_MOOD_KEYS.findIndex(([k]) => e < k);
  if (i === -1) i = PF_MOOD_KEYS.length;
  const [ea, ka] = PF_MOOD_KEYS[Math.max(0, i - 1)], [eb, kb] = PF_MOOD_KEYS[Math.min(PF_MOOD_KEYS.length - 1, i)];
  const t = eb === ea ? 0 : clamp01((e - ea) / (eb - ea));
  const A = PF_MOODS[ka], B = PF_MOODS[kb], pal = {};
  for (const key of Object.keys(A)) pal[key] = Array.isArray(A[key]) ? A[key].map((c, j) => mix(c, B[key][j], t)) : mix(A[key], B[key], t);

  pal.inside = mix('#4A3F38', '#FFE3A3', pal.lights);
  pfPal = pal;

}

function pfDrawSunMoon(pal) {

function pfNewPerson(o = {}) {

function pfWalkTo(p, x, speed) {

function pfUpdatePerson(p, dt) {
  p.timer -= dt;

  if (p.smoke) {                                  // raucht gerade – bleibt stehen und schaut nach vorn
    p.smoke.t += dt; p.facing = 'front';

    return;

const PF_DRAGS = [2.5, 5, 7.5];   // Startzeit der drei Züge (je 1 s)
function pfSmokeHandUp(t) { return t < 1.2 || PF_DRAGS.some(d => t >= d && t < d + 1); }
function pfStartSmoke() {

  if (cand.length) pick(cand).smoke = { t: 0 };

function pfDrawSmoke(p, x, yb) {
  const c = pfCtx, t = p.smoke.t;
  const px = (dx, dy, col, a = 1) => { c.globalAlpha = a; c.fillStyle = col; c.fillRect(x + dx, yb + dy, 1, 1); c.globalAlpha = 1; };
  const dragging = PF_DRAGS.some(d => t >= d && t < d + 1);
  if (t < 9.6) {
    if (pfSmokeHandUp(t)) {               // Zigarette im Mund
      px(5, -10, '#F2F2F2'); px(6, -10, '#F2F2F2'); px(7, -10, dragging ? '#FF7A2A' : '#C8452A');
      if (t < 1.2 && t > .3 && Math.sin(t * 40) > 0) px(7, -11, '#FFD34D');   // Feuerzeug flackert
    } else {                              // Zigarette in der Hand unten

    }

  } else if (t < 11.6) {                  // austreten: kleine Funken, Fuß tippt
    if (Math.sin(t * 30) > 0) { px(8, -1, '#FF7A2A'); px(9, -2, '#FFD34D', .7); }
    px(7, -1, '#2A2A2A');
  }
  // Rauchwölkchen nach jedem Zug: steigt auf und verblasst
  for (const d of PF_DRAGS) {
    const u = t - (d + 1);
    if (u > 0 && u < 2) { const a = .55 * (1 - u / 2), up = Math.round(u * 4); px(4, -11 - up, '#D8D8D8', a); px(5 + (up % 2), -12 - up, '#D8D8D8', a); }
  }
}

function pfStartSkater() {
  const dir = Math.random() < .5 ? 1 : -1;
  const sk = pfNewPerson({ special: 'skater', skin: pick(PF_SKIN.slice(0, 2)), shirt: pick(['#2A9D8F', '#E4572E', '#3D7DD8']), pants: '#4A6FA5' });
  pfCritters.push({
    x: dir > 0 ? -10 : PF_W + 10, y: 57.5, dir, t: 0,
    update(dt) { this.t += dt; this.x += this.dir * 34 * dt; if (this.x < -14 || this.x > PF_W + 14) this.gone = true; },
    draw() {
      const yb = 57 + (Math.sin(this.t * 9) > .85 ? -1 : 0);        // kleines Hüpfen über Fugen
      Object.assign(sk, { x: this.x, y: yb - 2, facing: this.dir > 0 ? 'right' : 'left', state: 'idle' });
      pfDrawPerson(sk);
      const c = pfCtx, bx = Math.round(this.x) - 5;
      c.fillStyle = '#5A3A24'; c.fillRect(bx, yb - 2, 11, 1); c.fillStyle = '#2A2A2A'; c.fillRect(bx - 1, yb - 3, 1, 1); c.fillRect(bx + 11, yb - 3, 1, 1);
      c.fillStyle = '#E8E8E8'; c.fillRect(bx + 1, yb - 1, 2, 1); c.fillRect(bx + 8, yb - 1, 2, 1);
    },
  });
}

// ---------- Flugzeug weit weg am Himmel ----------
function pfStartPlane() {
  const dir = Math.random() < .5 ? 1 : -1;
  pfPlane = { x: dir > 0 ? -6 : PF_W + 6, y: Math.floor(rnd(4, 13)), dir, trail: [] };
}
function pfDrawPlane(dt, pal) {
  if (!pfPlane) return;
  const P = pfPlane, c = pfCtx, night = pal.stars > .4;
  P.x += P.dir * 6 * dt;                                  // sehr langsam – es ist ja weit weg
  if (P.x < -30 || P.x > PF_W + 30) { pfPlane = null; return; }
  const x = Math.round(P.x), y = P.y, d = P.dir;
  if (!night) {                                           // Kondensstreifen
    for (let i = 3; i < 26; i++) { c.globalAlpha = .45 * (1 - i / 26); c.fillStyle = '#FFFFFF'; c.fillRect(x - d * i, y, 1, 1); }
    c.globalAlpha = 1;
  }
  c.fillStyle = night ? '#4A5578' : '#8A94A0';
  c.fillRect(d > 0 ? x - 2 : x - 1, y, 4, 1);             // Rumpf
  c.fillRect(x, y + 1, 1, 1);                             // Flügel
  c.fillRect(x - d * 2, y - 1, 1, 1);                     // Leitwerk
  if (night) {                                            // Positionslichter blinken
    if (Math.sin(pfTime * 6) > .6) { c.fillStyle = '#FF4040'; c.fillRect(x - d * 2, y - 1, 1, 1); }
    if (Math.sin(pfTime * 6 + 2) > .8) { c.fillStyle = '#FFFFFF'; c.fillRect(x + d * 2, y, 1, 1); }
  }
}

// ---------- Die zwei Stammgäste: warten immer zusammen ----------
// Mal schlendern sie gemeinsam, mal halten sie Händchen, ab und zu ein Kuss mit kleinem Herz.
const pfCouple = { mode: 'idle', t: 4, hold: false, heart: null };
function pfCoupleMembers() { return [pfPeople.find(p => p.special === 'jacke'), pfPeople.find(p => p.special === 'sakko')]; }

function pfUpdateMama(dt) {
  const p = pfPeople.find(q => q.special === 'mama');
  if (!p || p.state !== 'idle' || (p.timer -= dt) > 0) return;
  if (Math.random() < .35) { p.state = 'walk'; pfWalkTo(p, rnd(PF_W * .55, PF_W * .88), 7); }
  else { p.facing = pick(['front', 'front', 'left', 'right']); }
  p.timer = rnd(3, 8);
}

function pfUpdateCouple(dt) {
  const [a, b] = pfCoupleMembers();
  if (!a || !b) return;
  const C = pfCouple;
  C.t -= dt;
  const bothIdle = a.state === 'idle' && b.state === 'idle';
  if (C.mode === 'walk') {
    if (bothIdle) { C.mode = 'idle'; C.t = rnd(3, 7); }
    return;
  }
  if (C.mode === 'kiss') {
    b.x = Math.max(b.x - 6 * dt, a.x + 6);                  // ein Stück näher ran
    if (!C.heart && C.t < 1.8) C.heart = { x: a.x + 3, t: 0 };
    if (C.t <= 0) { C.mode = 'idle'; C.t = rnd(3, 6); b.x = a.x + 8; a.facing = b.facing = 'front'; }
    return;
  }
  if (C.t > 0) return;
  C.hold = false;
  a.facing = b.facing = 'front';
  const roll = Math.random();
  if (roll < .3) {                                          // gemeinsam ein Stück gehen
    C.mode = 'walk';
    const target = rnd(PF_W * .15, PF_W * .75 - 8);
    a.state = 'walk'; pfWalkTo(a, target, 8);
    b.state = 'walk'; pfWalkTo(b, target + 8, 8);
  } else if (roll < .62) {                                  // Händchen halten
    C.mode = 'idle'; C.hold = true; C.t = rnd(6, 12);
  } else if (roll < .74) {                                  // Kuss
    C.mode = 'kiss'; C.t = 2.4; a.facing = 'right'; b.facing = 'left';
  } else {                                                  // sich anschauen oder umschauen
    C.mode = 'idle'; C.t = rnd(2, 5);
    if (Math.random() < .5) { a.facing = 'right'; b.facing = 'left'; }
    else { a.facing = pick(['front', 'left']); b.facing = pick(['front', 'right']); }
  }
}

function pfDrawCoupleExtras(dt) {
  const [a, b] = pfCoupleMembers();
  if (!a || !b) return;
  const c = pfCtx, C = pfCouple;
  // Händchen halten: die beiden Hände treffen sich in der Mitte
  if (C.hold && a.facing === 'front' && b.facing === 'front' && Math.abs(b.x - a.x - 8) < 1) {
    c.fillStyle = a.skin; c.fillRect(Math.round(a.x) + 4, Math.round(a.y) - 4, 1, 1);
  }
  // Mini-Herz: steigt etwa einen Meter (≈ 9 Pixel) hoch und platzt dann
  if (C.heart) {
    const h = C.heart; h.t += dt;
    const x = Math.round(h.x), y0 = Math.round(a.y) - 18;
    if (h.t < 1.6) {
      const y = Math.round(y0 - 9 * (h.t / 1.6));
      c.globalAlpha = Math.min(1, h.t * 4);
      c.fillStyle = '#FF5A7A';
      c.fillRect(x - 1, y, 1, 1); c.fillRect(x + 1, y, 1, 1); c.fillRect(x - 1, y + 1, 3, 1); c.fillRect(x, y + 2, 1, 1);
      c.globalAlpha = 1;
    } else if (h.t < 2) {
      const u = (h.t - 1.6) / .4, y = y0 - 9, d = 1 + Math.round(u * 2);
      c.globalAlpha = 1 - u; c.fillStyle = '#FF8FA3';
      c.fillRect(x - d, y - d, 1, 1); c.fillRect(x + d, y - d, 1, 1); c.fillRect(x - d, y + d, 1, 1); c.fillRect(x + d, y + d, 1, 1);
      c.globalAlpha = 1;
    } else C.heart = null;
  }
}

// ---------- Hintergrund Plänterwald ----------
// Farben hängen am Sonnenstand: tagsüber weiße Häuser und sattes Grün, nachts dunkel mit erleuchteten Fenstern.
function pfDrawBackdrop(pal) {
  const c = pfCtx, light = clamp01((pal.sun.elev + 8) / 20);
  const tint = col => mix(col, pal.bld[1], .22);                 // an die Stimmung (Sonnenuntergang …) anpassen
  const white = tint(mix('#262D4A', '#F1F1EC', light)), bands = tint(mix('#1C2240', '#B9C1CA', light));
  // Weiße Siedlung: Scheiben mit Fensterbändern
  pfSkyline.forEach(b => {
    c.fillStyle = white; c.fillRect(b.x, b.top, b.w, 44 - b.top);
    c.fillStyle = bands; for (let y = b.top + 2; y < 44; y += 2) c.fillRect(b.x + 1, y, b.w - 2, 1);
    if (pal.lights > 0) { c.fillStyle = `rgba(255,214,107,${pal.lights.toFixed(2)})`; b.wins.forEach(([wx, wy]) => c.fillRect(b.x + wx, b.top + 2 + wy - (wy % 2), 1, 1)); }
  });
  // Estrel Tower: schlanker Glasturm mit schräger Spitze, rechts neben der Siedlung
  const ex = Math.min(PF_W - 8, Math.round(PF_W * .88)), glass = tint(mix('#1E2A44', '#6F879C', light)), shine = tint(mix('#2C3A5A', '#A9BED0', light));
  c.fillStyle = glass; c.fillRect(ex, 9, 6, 35);
  c.fillRect(ex, 5, 2, 4); c.fillRect(ex + 2, 6, 2, 3); c.fillRect(ex + 4, 7, 2, 2);  // schräg abgeschnittene Spitze
  c.fillStyle = shine; for (let x = ex + 1; x < ex + 6; x += 2) c.fillRect(x, 9, 1, 35);
  if (pal.lights > 0) { c.fillStyle = `rgba(255,214,107,${(pal.lights * .8).toFixed(2)})`; for (let y = 12; y < 42; y += 5) c.fillRect(ex + 2 + (y % 3), y, 1, 1); }
  // Viel Grün davor: runde Baumkronen, ein paar schon herbstlich
  const greens = [mix('#14261C', '#4F8B45', light), mix('#0F1E16', '#2F6B3A', light), mix('#2A1E16', '#D9822B', light), mix('#2A1A16', '#C0442B', light)].map(tint);
  pfTrees.forEach(t => {
    const cy = 44 - t.r - t.lift;
    c.fillStyle = greens[t.c];
    for (let dy = -t.r; dy <= t.r + t.lift; dy++) {
      const w = dy > 0 ? t.r : Math.round(Math.sqrt(t.r * t.r - dy * dy));
      c.fillRect(t.x - w, cy + dy, w * 2 + 1, 1);
    }
  });
}

// ---------- S-Bahn: einfahren, halten, Türen, ausfahren ----------
const PF_CARS = 4, PF_CAR_L = 46, PF_CAR_GAP = 2, PF_TRAIN_LEN = PF_CARS * (PF_CAR_L + PF_CAR_GAP);
const PF_DOORS = [.26, .66];
const PF_PHASES = { arr: 7, open: .8, dwell: 8, close: .8, wait: 1.2, dep: 7 };

function pfDoorXs(x0) {   // Mitte jeder Tür in Szenen-Koordinaten
  const xs = [];
  for (let i = 0; i < PF_CARS; i++) for (const fx of PF_DOORS) xs.push(Math.round(x0 + i * (PF_CAR_L + PF_CAR_GAP) + PF_CAR_L * fx) + 3);
  return xs;
}

function pfDrawTrain(x0, doors, pal) {
  drawPixelSBahn(pfCtx, x0, 27, PF_CARS, PF_CAR_L, { doors, inside: pal.inside });
}

function pfUpdateTrain(dt) {
  if (!pfTrain) {
    if (pfTime < pfNextTrain) return;
    pfTrain = { phase: 'arr', t: 0, x: 0, doors: 0, start: -PF_TRAIN_LEN - 10, stop: Math.round((PF_W - PF_TRAIN_LEN) / 2) };
    pfNextTrain = pfTime + PF_TRAIN_EVERY;
  }
  const T = pfTrain;
  T.t += dt;
  const u = Math.min(1, T.t / PF_PHASES[T.phase]);
  if (T.phase === 'arr') T.x = T.start + (T.stop - T.start) * (1 - Math.pow(1 - u, 3));       // bremst sanft ab
  if (T.phase === 'dep') T.x = T.stop + (PF_W + 10 - T.stop) * Math.pow(u, 2.6);              // fährt langsam an
  if (T.phase === 'open') T.doors = u;
  if (T.phase === 'close') T.doors = 1 - u;
  if (T.phase === 'dwell') pfDwell(T);
  if (u < 1) return;
  const next = { arr: 'open', open: 'dwell', dwell: 'close', close: 'wait', wait: 'dep', dep: null }[T.phase];
  if (next === 'open' && ++pfTrainCount % 3 === 0) pfSpawnRunner(T);
  if (next === 'dwell') pfStartDwell(T);
  if (next === 'close') pfPeople.forEach(p => { if (p.state === 'toTrain') { p.state = 'idle'; p.timer = rnd(1, 3); } });
  if (!next) { pfTrain = null; return; }
  T.phase = next; T.t = 0;
}

function pfStartDwell(T) {
  const doors = pfDoorXs(T.stop).filter(x => x > 4 && x < PF_W - 4);
  T.alight = [];
  if (!doors.length) return;
  // ein paar Wartende steigen ein …
  const regulars = pfPeople.filter(p => !p.special && !p.smoke && p.state !== 'boarding');
  const n = Math.min(regulars.length, Math.floor(rnd(1, 4)));
  regulars.sort(() => Math.random() - .5).slice(0, n).forEach(p => {
    const door = doors.reduce((a, b) => Math.abs(b - p.x) < Math.abs(a - p.x) ? b : a);
    p.state = 'toTrain'; pfWalkTo(p, door, rnd(12, 16));
  });
  // … und ein paar Neue steigen aus
  const out = Math.max(1, pfRegularCount() - (regulars.length - n) + Math.floor(rnd(-1, 2)));
  for (let i = 0; i < out; i++) T.alight.push({ at: rnd(.3, 4.5), x: pick(doors) });
}

function pfDwell(T) {
  T.alight = (T.alight || []).filter(a => {
    if (T.t < a.at) return true;
    pfPeople.push(pfNewPerson({ x: a.x, y: 47, state: 'alighting', targetY: Math.floor(rnd(51, 58)) }));
    return false;
  });
}

// Jede dritte Bahn: jemand sprintet in letzter Sekunde vom Rand zur Tür
function pfSpawnRunner(T) {
  const doors = pfDoorXs(T.stop).filter(x => x > 4 && x < PF_W - 4);
  if (!doors.length) return;
  const fromLeft = Math.random() < .5;
  const door = fromLeft ? Math.min(...doors) : Math.max(...doors);
  const p = pfNewPerson({ x: fromLeft ? -6 : PF_W + 6, y: Math.floor(rnd(51, 57)), run: true });
  p.state = 'toTrain'; pfWalkTo(p, door, 42);
  pfPeople.push(p);
}

// ---------- Seltene Ereignisse ----------
function pfEvents(dt, pal) {
  const dark = pal.stars > .7, day = pal.sun.elev > 2;
  for (const k of Object.keys(pfNextEvent)) {
    if (pfTime < pfNextEvent[k]) continue;
    pfNextEvent[k] += PF_EVENT_EVERY[k];
    if (k === 'star' && dark) pfStartStar();       // Sternschnuppe nur, wenn es richtig dunkel ist
    if (k === 'cat') pfStartCat();
    if (k === 'pigeons') pfStartPigeons();
    if (k === 'skater' && day) pfStartSkater();    // Skater nur tagsüber
    if (k === 'plane') pfStartPlane();
    if (k === 'smoke') pfStartSmoke();
  }
  pfCritters.forEach(cr => cr.update(dt));
  pfCritters = pfCritters.filter(cr => !cr.gone);
}

function pfStartStar() {
  const left = Math.random() < .5;
  pfStar = { x: left ? rnd(PF_W * .05, PF_W * .3) : rnd(PF_W * .65, PF_W * .9), y: rnd(2, 9), dir: left ? -1 : 1, t: 0 };
}
function pfDrawStar(dt) {
  if (!pfStar) return;
  const st = pfStar; st.t += dt;
  const life = 1.1, u = st.t / life;
  if (u >= 1) { pfStar = null; return; }
  const hx = st.x + st.dir * 22 * u, hy = st.y + 9 * u;
  const fade = u < .15 ? u / .15 : 1 - Math.max(0, u - .6) / .4;
  for (let i = 0; i < 7; i++) {
    pfCtx.fillStyle = `rgba(255,255,255,${(fade * (1 - i / 7)).toFixed(2)})`;
    pfCtx.fillRect(Math.round(hx - st.dir * i * 1.4), Math.round(hy - i * .6), 1, 1);
  }
  pfCtx.fillStyle = `rgba(255,248,200,${fade.toFixed(2)})`; pfCtx.fillRect(Math.round(hx), Math.round(hy), 1, 1);
}

// Kleine rote Katze spaziert über den Bahnsteig
function pfStartCat() {
  const dir = Math.random() < .5 ? 1 : -1;
  pfCritters.push({
    x: dir > 0 ? -12 : PF_W + 12, y: 58, dir, step: 0,
    update(dt) { this.x += this.dir * 13 * dt; this.step += dt; if (this.x < -14 || this.x > PF_W + 14) this.gone = true; },
    draw() {
      const x = Math.round(this.x), yb = this.y, d = this.dir, fr = Math.floor(this.step * 7) % 2;
      const f = (dx, dy, w, h, col) => { pfCtx.fillStyle = col; pfCtx.fillRect(d > 0 ? x + dx : x + 10 - dx - w, yb + dy, w, h); };
      const fur = '#D2552C', dark = '#9C3A1C';
      f(0, -8, 1, 2, fur); f(1, -6, 1, 1, fur);                 // Schwanz
      f(1, -5, 6, 3, fur); f(3, -5, 1, 1, dark); f(5, -5, 1, 1, dark);
      f(6, -7, 4, 4, fur); f(6, -8, 1, 1, fur); f(9, -8, 1, 1, fur); // Kopf + Ohren
      f(8, -6, 1, 1, '#1E1E1E'); f(9, -5, 1, 1, '#F4A3A3');
      if (fr) { f(2, -2, 1, 2, dark); f(6, -2, 1, 2, dark); } else { f(3, -2, 1, 2, dark); f(5, -2, 1, 2, dark); }
    },
  });
}

// Zwei Tauben: einfliegen, landen, rumpicken, wegfliegen
function pfStartPigeons() {
  const fromLeft = Math.random() < .5, base = rnd(PF_W * .25, PF_W * .75);
  [0, 1].forEach(i => pfCritters.push({
    phase: 'in', t: -i * .4, dir: fromLeft ? 1 : -1, step: rnd(0, 1),
    fx: fromLeft ? -8 - i * 6 : PF_W + 8 + i * 6, fy: 4 + i * 3,
    lx: base + i * 9 - 4, ly: 54 + i * 2, stay: rnd(8, 11), peck: 0,
    x: 0, y: 0,
    update(dt) {
      this.t += dt; this.step += dt;
      if (this.phase === 'in') {
        const u = Math.max(0, Math.min(1, this.t / 2.2)), e = 1 - Math.pow(1 - u, 2);
        this.x = this.fx + (this.lx - this.fx) * e; this.y = this.fy + (this.ly - this.fy) * e;
        if (u >= 1) { this.phase = 'ground'; this.t = 0; }
      } else if (this.phase === 'ground') {
        this.peck = Math.sin(this.t * 7 + this.lx) > .55 ? 1 : 0;            // Kopf runter, Kopf hoch
        if (Math.random() < dt * .6) { this.dir *= -1; }                      // umdrehen
        if (Math.random() < dt * .5) this.x += this.dir * 2;                  // kleiner Hüpfer
        if (this.t > this.stay) { this.phase = 'out'; this.t = 0; this.ox = this.x; this.oy = this.y; this.dir = fromLeft ? 1 : -1; }
      } else {
        const u = Math.min(1, this.t / 2.2), e = u * u;
        this.x = this.ox + this.dir * (PF_W * .8) * e; this.y = this.oy - 58 * e;
        if (u >= 1) this.gone = true;
      }
    },
    draw() {
      const x = Math.round(this.x), yb = Math.round(this.y), d = this.dir;
      const f = (dx, dy, w, h, col) => { pfCtx.fillStyle = col; pfCtx.fillRect(d > 0 ? x + dx : x + 7 - dx - w, yb + dy, w, h); };
      const flying = this.phase !== 'ground', wing = Math.floor(this.step * 10) % 2;
      f(0, -3, 1, 1, '#6E737A');                                  // Schwanz
      f(1, -4, 4, 3, '#8E949C');                                  // Körper
      if (!flying && this.peck) { f(4, -3, 2, 2, '#7A8088'); f(6, -2, 1, 1, '#E8A33D'); f(5, -3, 1, 1, '#1E1E1E'); }
      else { f(4, -5, 1, 1, '#5FA37E'); f(4, -7, 2, 2, '#7A8088'); f(5, -7, 1, 1, '#1E1E1E'); f(6, -6, 1, 1, '#E8A33D'); }
      if (flying) { if (wing) { f(1, -6, 1, 1, '#B4B9C0'); f(2, -7, 2, 2, '#B4B9C0'); } else { f(1, -1, 3, 1, '#B4B9C0'); } }
      else { f(2, -1, 1, 1, '#D46A6A'); f(3, -1, 1, 1, '#D46A6A'); }
    },
  }));
}

// Schild links, damit rechts daneben Weiße Siedlung und Estrel Tower frei zu sehen sind
const PF_SIGN_W = 'PLÄNTERWALD'.length * 6 + 5;
function pfSignCx() { return Math.max(PF_SIGN_W / 2 + 3, Math.round(PF_W * .27)); }
function pfDrawSign(cx) {
  // Blaues Stationsschild mit der Pixelschrift der Laufschrift
  const c = pfCtx, cols = textToCols('PLÄNTERWALD');
  const w = cols.length + 6, x = Math.round(cx - w / 2), y = 14;
  c.fillStyle = '#5B5B5B'; c.fillRect(x + 4, y + 11, 1, 38); c.fillRect(x + w - 5, y + 11, 1, 38);
  c.fillStyle = '#13235B'; c.fillRect(x, y, w, 11);
  c.fillStyle = '#FFFFFF';
  cols.forEach((col, i) => col.forEach((on, row) => { if (on) c.fillRect(x + 3 + i, y + 2 + row, 1, 1); }));
}

function pfDrawBench(x) {
  const c = pfCtx;
  c.fillStyle = '#8A5A35'; c.fillRect(x, 46, 18, 2); c.fillRect(x, 49, 18, 2);
  c.fillStyle = '#5E5E5E'; c.fillRect(x + 2, 51, 1, 4); c.fillRect(x + 15, 51, 1, 4); c.fillRect(x + 2, 46, 1, 5); c.fillRect(x + 15, 46, 1, 5);
}

function pfFrame(ts) {
  const dt = pfLast === null ? 0 : Math.min(.1, (ts - pfLast) / 1000);
  pfLast = ts; pfTime += dt;
  if (Math.floor(pf.clientWidth / PF_SCALE) !== PF_W) pfSetup();
  const pal = pfPalette();
  const c = pfCtx, W = PF_W;

  // Himmel in Pixel-Streifen
  pal.bands.forEach((col, i) => { c.fillStyle = col; c.fillRect(0, i * PF_BAND_H, W, PF_BAND_H); });
  if (pal.stars > 0) pfStars.forEach(s => { if (Math.sin(pfTime * 1.5 + s.p) > -.3) { c.fillStyle = `rgba(255,255,255,${pal.stars.toFixed(2)})`; c.fillRect(s.x, s.y, 1, 1); } });
  pfDrawSunMoon(pal);
  pfDrawPlane(dt, pal);
  pfEvents(dt, pal);
  pfDrawStar(dt);
  // Wolken ziehen langsam
  pfClouds.forEach(cl => {
    cl.x += cl.v * dt; if (cl.x > W + 4) { cl.x = -cl.w - 4; cl.y = Math.floor(rnd(3, 16)); }
    const x = Math.round(cl.x);
    c.fillStyle = pal.cloud;
    c.fillRect(x, cl.y + 2, cl.w, 3); c.fillRect(x + 3, cl.y, Math.floor(cl.w * .45), 3); c.fillRect(x + Math.floor(cl.w * .5), cl.y + 1, Math.floor(cl.w * .3), 2);
    c.fillStyle = pal.cloudShade; c.fillRect(x + 1, cl.y + 4, cl.w - 2, 1);
  });
  pfDrawBackdrop(pal);

  // S-Bahn (hinter den Leuten)
  pfUpdateTrain(dt);
  if (pfTrain) pfDrawTrain(pfTrain.x, pfTrain.doors, pal);
  // Gleis
  c.fillStyle = pal.rail; c.fillRect(0, 44, W, 1);

  // Bahnsteig: Oberfläche, weiße Linie, Vorderkante mit Fugen
  c.fillStyle = pal.floor; c.fillRect(0, 45, W, 13);
  c.fillStyle = pal.floorLine; c.fillRect(0, 46, W, 1);
  c.fillStyle = pal.edge; c.fillRect(0, 58, W, 6);
  c.fillStyle = pal.edgeLine; for (let x = 3; x < W; x += 10) c.fillRect(x, 58, 1, 6);

  pfDrawSign(pfSignCx());
  pfDrawBench(Math.max(4, Math.round(W * .1)));

  // Leute – von hinten nach vorne zeichnen
  pfUpdateCouple(dt);
  pfUpdateMama(dt);
  pfPeople.forEach(p => pfUpdatePerson(p, dt));
  pfPeople = pfPeople.filter(p => !p.gone);
  [...pfPeople.map(p => ({ y: p.y, draw: () => pfDrawPerson(p) })), ...pfCritters]
    .sort((a, b) => a.y - b.y).forEach(o => o.draw());
  pfDrawCoupleExtras(dt);

  requestAnimationFrame(pfFrame);
}
pfSetup();
requestAnimationFrame(pfFrame);
</script>
</body>
</html>
